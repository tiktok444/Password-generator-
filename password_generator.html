<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .length-container {
            margin-bottom: 15px;
            text-align: left;
        }
        .length-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .length-container input[type="range"] {
            width: 100%;
        }
        .options-container {
            margin-bottom: 15px;
            text-align: left;
            font-size: 14px;
            color: #555;
        }
        .options-container div {
            margin-bottom: 5px;
        }
        .options-container label {
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Password Generator</h2>
    <input type="text" id="password" readonly placeholder="Your Password">
    
    <div class="length-container">
        <label for="length">Password Length: <span id="length-val">12</span></label>
        <input type="range" id="length" min="4" max="32" value="12" oninput="document.getElementById('length-val').innerText = this.value">
    </div>

    <div class="options-container">
        <div>
            <input type="checkbox" id="uppercase" checked>
            <label for="uppercase">Include Uppercase Letters</label>
        </div>
        <div>
            <input type="checkbox" id="lowercase" checked>
            <label for="lowercase">Include Lowercase Letters</label>
        </div>
        <div>
            <input type="checkbox" id="numbers" checked>
            <label for="numbers">Include Numbers</label>
        </div>
        <div>
            <input type="checkbox" id="symbols" checked>
            <label for="symbols">Include Symbols</label>
        </div>
    </div>

    <button onclick="generatePassword()">Generate Password</button>
    <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
</div>

<script>
    function generatePassword() {
        const length = document.getElementById('length').value;
        const includeUppercase = document.getElementById('uppercase').checked;
        const includeLowercase = document.getElementById('lowercase').checked;
        const includeNumbers = document.getElementById('numbers').checked;
        const includeSymbols = document.getElementById('symbols').checked;

        const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerChars = "abcdefghijklmnopqrstuvwxyz";
        const numberChars = "0123456789";
        const symbolChars = "!@#$%^&*()_+~`|}{[]\:;?><,./-=";

        let charset = "";
        if (includeUppercase) charset += upperChars;
        if (includeLowercase) charset += lowerChars;
        if (includeNumbers) charset += numberChars;
        if (includeSymbols) charset += symbolChars;

        if (charset === "") {
            alert("Please select at least one character type!");
            return;
        }

        let password = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charset.length);
            password += charset[randomIndex];
        }
        document.getElementById("password").value = password;
    }

    function copyToClipboard() {
        const passwordField = document.getElementById("password");
        if (passwordField.value === "") {
            alert("No password to copy!");
            return;
        }
        passwordField.select();
        passwordField.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(passwordField.value).then(() => {
            alert("Password copied to clipboard!");
        }).catch(err => {
            alert("Failed to copy password.");
        });
    }
</script>

</body>
</html>
